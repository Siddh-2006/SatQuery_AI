paths:
  train_parquet: data/cdvqa_train_clean.parquet
  val_parquet: data/cdvqa_val_clean.parquet
  annotations: data/cdvqa_annotations/Train_images.json
  image_root: data/second_images/SECOND_train_set

  terrafm_weights: models/terrafm/TerraFM-B.pth
  llm_dir: models/tinyrs_r1

  checkpoint_dir: checkpoints
  log_dir: logs


training:
  batch_size: 4
  num_epochs: 3
  gradient_accumulation_steps: 1

  learning_rate: 3.0e-5
  weight_decay: 0.01
  adam_eps: 1.0e-4

  scheduler: cosine
  min_learning_rate: 1.0e-6


lora:
  r: 16
  alpha: 32
  dropout: 0.05

  target_modules:
    - q_proj
    - v_proj


data:
  image_size: 224


evaluation:
  max_new_tokens: 16
  max_samples_per_question_type: 150
